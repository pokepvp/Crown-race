name: decode-assets
on:
  push:
    paths:
      - "b64/**"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets into assets/
        run: |
          mkdir -p assets
          for f in b64/*.b64; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .b64)
            base64 -d "$f" > "assets/$name"
            rm "$f"
          done
      - name: Commit decoded assets
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Decode uploaded assets" || echo "nothing to commit"
          git push
