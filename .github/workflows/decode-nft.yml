name: decode-nft
on:
  push:
    paths:
      - "b64nft/**"
permissions:
  contents: write
concurrency:
  group: decode-nft
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode split base64 NFT images into nft/images/
        run: |
          mkdir -p nft/images
          for base in $(ls b64nft | sed 's/\.b64\.part.*//' | sort -u); do
            cat "b64nft/$base.b64.part"* | base64 -d > "nft/images/$base"
          done
          rm -f b64nft/*.b64.part*
      - name: Commit decoded NFT images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Decode NFT images" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
