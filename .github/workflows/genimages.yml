name: genimages
on:
  push:
    paths:
      - "gen/**"
permissions:
  contents: write
concurrency:
  group: genimages
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode masters
        run: |
          for base in $(ls gen/masters | sed 's/\.b64\.part.*//' | sort -u); do
            cat "gen/masters/$base.b64.part"* | base64 -d > "gen/masters/$base"
          done
          rm -f gen/masters/*.b64.part*
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          pip install --quiet pillow
      - name: Render all 2222 card images
        run: python3 gen/render.py
      - name: Commit pipeline and masters
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gen
          git commit -m "Card render pipeline + masters" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
      - name: Commit images in chunks
        run: |
          for start in 1 251 501 751 1001 1251 1501 1751 2001; do
            end=$((start+249)); if [ $end -gt 2222 ]; then end=2222; fi
            for i in $(seq $start $end); do git add "nft/images/$i.png"; done
            git commit -m "NFT images $start-$end" || echo "skip $start"
            git pull --rebase origin main || true
            git push
          done
